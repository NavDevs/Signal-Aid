name: signalaid_flutter
description: "Signal Aid - Fire + Ambulance driver dispatch app"
publish_to: 'none'

version: 2.7.0+28

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  intl: ^0.19.0
  flutter_launcher_icons: ^0.13.1
  http: ^1.6.0
  socket_io_client: ^3.1.6
  geolocator: ^13.0.1
  path_provider: ^2.1.2
  url_launcher: ^6.3.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#0B0D12"
  adaptive_icon_foreground: "assets/images/icon.png"
